name: Verify portfolio site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the application
        run: |
          npm ci
          npm run build
          grep -Fq "Solstice Journal" dist/index.html
          python3 -m http.server 4331 --directory dist > /tmp/site.log 2>&1 &
          curl --retry 15 --retry-all-errors --retry-delay 1 -fsSL http://localhost:4331/ -o /tmp/portfolio-home.html
          npm install --prefix "$RUNNER_TEMP/site-check" --no-audit --no-fund playwright-core@1.65.1
          cat > "$RUNNER_TEMP/site-check/check.cjs" <<'JS'
          const { chromium } = require("playwright-core");
          (async () => {
            const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", headless: true });
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on("pageerror", err => errors.push(err.message));
              for (const width of [1440, 390]) {
                await page.setViewportSize({ width, height: 900 });
                await page.goto("http://localhost:4331/", { waitUntil: "domcontentloaded" });
                await page.locator("body").waitFor();
                if (!(await page.title()).includes("Solstice Journal") && !(await page.locator("body").innerText()).includes("Solstice Journal")) throw Error("Missing site identity");
                await page.screenshot({ path: process.env.RUNNER_TEMP + "/site-" + width + ".png", animations: "disabled" });
              }
              if (errors.length) throw Error(errors.join("\n"));
            } finally { await browser.close(); }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          JS
          node "$RUNNER_TEMP/site-check/check.cjs"
      - uses: actions/upload-artifact@v4
        with:
          name: site-previews
          path: ${{ runner.temp }}/site-*.png
          retention-days: 14
